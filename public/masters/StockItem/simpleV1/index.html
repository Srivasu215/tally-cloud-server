<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stock Items - Simple</title>

  <script>
    if (!location.pathname.endsWith('/') && !location.pathname.endsWith('.html')) {
      location.replace(location.pathname + '/' + location.search + location.hash);
    }
  </script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./index.css">
</head>

<body>
  <main class="main-wrapper">
    <div class="data-card">
      <div class="table-responsive">
        <table class="custom-table" id="rootItemsTable">
          <thead>
            <tr id="rootItemsHeaderRow">
              <th>Item Name</th>
              <th style="width: 200px;">Base Unit</th>
            </tr>
          </thead>
          <tbody id="rootItemsBody">
            <tr>
              <td colspan="2">Loading stock items...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script type="module" src="./index.js"></script>
</body>

</html>
